<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101014;
      color: #e5e5eb;
    }

    body {
      max-width: 48rem;
      margin: auto;
      padding: 5rem 1.5rem;
      line-height: 1.7;
    }

    h1 {
      color: #b78aff;
      font-size: clamp(3rem, 10vw, 5rem);
      margin: 0;
      letter-spacing: .04em;
    }

    a { color: #b78aff; }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Title }}</h1>
    <p>Amateur radio · San Antonio, Texas</p>
  </header>

  <main>
    {{ .Content }}
  </main>
</body>
</html>
